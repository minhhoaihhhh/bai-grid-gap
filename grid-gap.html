<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành grid-gap</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: #2196f3;
            padding: 10px;
            margin-bottom: 25px;
        }

        .example1 {
            grid-gap: 10px;
        }

        .example2 {
            grid-gap: 30px 10px;
        }

        .item {
            background: lightblue;
            padding: 25px;
            text-align: center;
            font-size: 24px;
        }
    </style>
</head>

<body>
    <h1>Thực hành grid-gap</h1>

    <h2>Ví dụ 1: grid-gap: 10px;</h2>
    <p>Khoảng cách giữa hàng và cột đều là 10px.</p>

    <div class="grid example1">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <h2>Ví dụ 2: grid-gap: 30px 10px;</h2>
    <p>Khoảng cách giữa hàng là 30px, giữa cột là 10px.</p>

    <div class="grid example2">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>
</body>

</html>
